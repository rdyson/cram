project_id = "cram"

[auth]
enabled = true
site_url = "https://cram.rdyson.dev"
additional_redirect_urls = ["https://cram.rdyson.dev/*", "http://localhost:3000/*"]

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = false
max_frequency = "1m"
otp_length = 8
otp_expiry = 3600

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true
